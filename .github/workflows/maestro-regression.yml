name: Maestro Cloud Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro-cloud:
    name: Run Android Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests on Maestro Cloud
        id: maestro
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: app/saucedemo.apk
          workspace: .maestro
          device-model: pixel_6
          device-os: android-35
          name: SauceDemo Regression - GitHub Actions
